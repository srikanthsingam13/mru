<!DOCTYPE html>
<html>
    <head>
        <title>Fourteen</title>
        <style>
            h1{
                color:green;
            }
            #h2tag{
                color:red;
            }
            #h3tag{
                color:yellowgreen;
            }
            .h4tag{
                color:blue;
            }
            .h5tag{
                color:darkcyan;
            }
            h4,h5,h6{
                color:darkorange;
            }
            *{
                background-color: black;
            }
        </style>
    </head>
    <body>
        <h1>h1 tag</h1>
        <h1>hello this is h1 tag</h1>
        <h2 id="h2tag"> h2 tag</h2>
        <h2 id="h3tag">hello this is h2 tag</h2>
        <h3 class="h4tag"> h3 tag</h3>
        <h3 class="h5tag">hello this is h3 tag</h3>
        <h4> h4 tag</h4>
        <h4>hello this is h4 tag</h4>
        <h5>h5 tag</h5>
        <h6>h6 tag</h6>
        <p>this is a paragraph.....</p>
    </body>
</html>
