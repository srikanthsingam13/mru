<!DOCTYPE html>
<html>
<head>
    <title>Change Text</title>
</head>
<body>

<h1 id="heading">Welcome to JavaScript</h1>

<button onclick="changeText()">Change Text</button>

<script>
function changeText() {
    document.getElementById("heading").innerHTML = "Welcome to DOM Manipulation";
}
</script>

</body>
</html>
