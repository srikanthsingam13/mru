<!DOCTYPE html>
<html>
<head>
    <title>Change All Background Colors</title>
    <style>
        .box{
            width:150px;
            padding:15px;
            margin:10px;
            border:1px solid black;
        }
    </style>
</head>
<body>

<div class="box">Java</div>
<div class="box">Python</div>
<div class="box">React</div>

<button onclick="changeAll()">Change Background</button>

<script>
function changeAll() {
    let elements = document.getElementsByClassName("box");

    for(let i = 0; i < elements.length; i++) {
        elements[i].style.backgroundColor = "lightgreen";
        elements[i].style.color = "blue";
    }
}
</script>

</body>
</html>
